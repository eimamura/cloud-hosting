# Single source of truth for this workspace's hosting catalog. Rendered by /catalog.html (and /index.html);
# validated by `tools/catalog.py check`. The narrative guide is docs/hosting-candidates.md.
#
#   enums      Allowed values and their labels / meanings. catalog.html and tools/catalog.py both read these.
#   roadmap    Experiments in recommended order. The ONLY place progress is recorded (status, project, url, date);
#              a service's tried status, the README project table, and the index.html cards are derived from it.
#   vendors    How far a coding agent can operate each vendor: api, cli (+ token env var), mcp, iac, human-only
#              steps, rating, checked date, sources.
#   services   One entry per hosting target: hosting facts, use, commercial terms, price, checked date, pricing
#              links. `vendor` is a vendor id or a list; `skipped` records why a target will not be tried.
#
# Strings may use inline Markdown (links, `code`, **bold**). Price: USD unless stated; † = not confirmed on the
# official page. When you re-verify an entry, update its `checked` date.

enums:
  category:
    static:
      label: Static site
    frontend:
      label: Frontend / SSR
      description: Framework-aware PaaS
    serverless:
      label: Serverless / edge
    container:
      label: Container / app PaaS
    kubernetes:
      label: Kubernetes
    vm:
      label: VM / VPS
      description: IaaS
    self-hosted:
      label: Self-hosted PaaS
      description: Runs on a VM / VPS
  free_tier:
    free:
      label: ✅ Free tier
      description: Usable free tier
    limited:
      label: 🟡 Limited
      description: Limited, trial credits, or sleeps when idle
    paid:
      label: ❌ Paid only
    closed:
      label: ⛔ Closed
      description: Closed to new customers
  commercial:
    allowed:
      label: ✅ Allowed
      description: Allowed, including on the free tier (within quotas)
    paid-plan:
      label: 🟡 Paid plan
      description: Allowed only on a paid plan, or the free tier is not suitable for production
    paid-only:
      label: 💰 Paid service
      description: Paid-only service; commercial use is normal
    closed:
      label: ⛔ Closed
      description: Closed to new customers
    n/a:
      label: — n/a
      description: Local tooling, not a hosting service
  mcp:
    official-write:
      label: 🟢 Official
      description: Official MCP server that can deploy / write
    official-limited:
      label: 🟡 Official (limited)
      description: Official, but read-only, docs-only, or limited
    community:
      label: 🔵 Community
      description: Community servers only
    none:
      label: — None
  rating:
    Full:
      label: Full
      description: Create, deploy, inspect, and tear down are all scriptable headlessly (CLI/API with a token env var).
    High:
      label: High
      description: Almost everything is scriptable; one-off UI steps (Git app install, OAuth consent, IAM bootstrap) or weaker tooling remain.
    Partial:
      label: Partial
      description: Some operations are scriptable, but deploys or key setup regularly need a browser or console.
    Low:
      label: Low
      description: The agent can only push code; deploy and configuration are UI-only.
  status:
    todo:
      label: ⬜ Not tried
    in-progress:
      label: 🔄 In progress
    done:
      label: ✅ Done
    skipped:
      label: ⏭ Skipped
  complexity:
    1:
      label: ★☆☆☆☆
      description: Minutes. Sign in, connect repo or run one CLI command.
    2:
      label: ★★☆☆☆
      description: An hour or so. A config file, a Dockerfile, or a small platform-specific setup.
    3:
      label: ★★★☆☆
      description: 'Cloud account setup: IAM / permissions, registries, custom domains, CI credentials.'
    4:
      label: ★★★★☆
      description: 'IaC defining many resources: networking, load balancers, databases, secrets.'
    5:
      label: ★★★★★
      description: 'You operate the platform yourself: clusters, servers, upgrades, TLS, monitoring.'
  rec:
    1:
      label: ★
    2:
      label: ★★
    3:
      label: ★★★
      description: Recommended first for this lab
  popularity:
    1:
      label: ●○○
      description: Niche or emerging
    2:
      label: ●●○
      description: Well known in its niche / region
    3:
      label: ●●●
      description: Mainstream, widely known

