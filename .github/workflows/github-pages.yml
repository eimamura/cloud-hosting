# Deploys the root entry page (index.html) and the catalog viewer (catalog.html + docs/) to GitHub Pages.
# Project docs: github-pages/README.md
name: github-pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - catalog.html
      - docs/**
      - tools/catalog.py
      - README.md
      - '*/README.md'
      - github-pages/**
      - .github/workflows/github-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate catalog
        run: |
          pip install --quiet pyyaml
          python tools/catalog.py check
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html catalog.html _site/
          mkdir -p _site/docs
          cp docs/*.md docs/*.yaml _site/docs/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deployment.outputs.page_url }}")"
          echo "HTTP $status"
          test "$status" = "200"
